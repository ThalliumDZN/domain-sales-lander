<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Domain For Sale</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* CRITICAL FIX: This ensures padding doesn't make elements wider than the screen */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0D162B;
            --bg-light: #1A2641;
            --card-bg: rgba(25, 38, 65, 0.85); /* Slightly less transparent for better text reading */
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #E0E7FF;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
            --btn-hover: #0ea5e9;
        }
        
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 0%, var(--bg-light) 0%, var(--bg-dark) 80%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem; /* Small padding to prevent edge touching on mobile */
        }

        .container {
            text-align: center;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            /* Responsive padding: Less on mobile, more on desktop */
            padding: clamp(2rem, 5vw, 4rem); 
            border-radius: 24px;
            border: 1px solid var(--card-border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 600px; /* Limits width on big screens */
            margin: 0 auto;
        }

        h1 {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            opacity: 0.9;
        }

        .domain-name {
            /* FIXED: Much more conservative sizing */
            font-size: clamp(1.5rem, 5vw, 2.8rem); 
            font-weight: 800;
            margin: 0 0 1.5rem 0;
            line-height: 1.2;
            
            /* Safety: Forces long text to wrap instead of breaking layout */
            word-wrap: break-word; 
            overflow-wrap: break-word;
            
            background: linear-gradient(to right, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-sub);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            margin-left: auto;
            margin-right: auto;
            max-width: 90%;
        }

        .btn {
            display: inline-block;
            background-color: var(--accent);
            color: #0f172a;
            /* Reduced side padding to prevent mobile overflow */
            padding: 1rem 1.5rem; 
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            border-radius: 12px;
            transition: all 0.2s ease;
            width: 100%; /* Takes up available space */
            max-width: 320px; /* But never gets wider than this */
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.2);
        }

        .btn:hover {
            background-color: var(--btn-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(56, 189, 248, 0.4);
        }

        .phone-number {
            margin-top: 1.5rem;
            font-size: 1rem;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 600;
        }
        
        .phone-icon {
            color: var(--text-main);
        }

        /* Mobile Specific Tweaks */
        @media (max-width: 480px) {
            .domain-name {
                font-size: 1.6rem; /* Hard limit for very small phones */
            }
            .container {
                padding: 2rem 1.5rem; /* Tighter padding on mobile */
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Available For Purchase</h1>
        <div class="domain-name" id="domain-display">www.example.com</div>
        <p>This premium domain name is currently available. If you are interested, please inquire below.</p>
        
        <a href="mailto:your-email@example.com?subject=Domain Inquiry" class="btn" id="contact-btn">
            Inquire via Email
        </a>

        <div class="phone-number">
            <span class="phone-icon">📞</span> (555) 123-4567
        </div>
    </div>

    <script>
        let cleanHost = window.location.hostname;
        document.getElementById('domain-display').innerText = cleanHost;
        
        const emailBtn = document.getElementById('contact-btn');
        const currentHref = emailBtn.getAttribute('href');
        emailBtn.setAttribute('href', currentHref + ": " + cleanHost);
    </script>

</body>
</html>
