<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Domain For Sale</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        :root {
            --bg: #050505;
            --neon-blue: #00f0ff;
            --neon-pink: #ff006e;
            --text: #ffffff;
            --text-dim: #888888;
            --card-bg: rgba(10, 10, 10, 0.9);
        }
        
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Animated mesh gradient background */
        .bg-layer {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .gradient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 20s infinite ease-in-out;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: var(--neon-blue);
            top: 10%;
            left: 20%;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: var(--neon-pink);
            bottom: 10%;
            right: 20%;
            animation-delay: 5s;
        }

        .orb-3 {
            width: 300px;
            height: 300px;
            background: #8b00ff;
            top: 50%;
            left: 50%;
            animation-delay: 10s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(50px, -50px) scale(1.1); }
            66% { transform: translate(-50px, 50px) scale(0.9); }
        }

        .container {
            max-width: 800px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4rem 3rem;
            position: relative;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 30px), calc(100% - 30px) 100%, 0 100%);
        }

        /* Glowing edges */
        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            padding: 1px;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-pink));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0.3;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 30px), calc(100% - 30px) 100%, 0 100%);
        }

        /* Corner notch accent */
        .corner-notch {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 30px;
            height: 30px;
            background: var(--neon-pink);
            box-shadow: 0 0 20px var(--neon-pink);
            animation: notchPulse 2s ease-in-out infinite;
        }

        @keyframes notchPulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; box-shadow: 0 0 30px var(--neon-pink); }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--neon-blue);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0.5rem 1rem;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--neon-blue);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--neon-blue);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--neon-blue);
            border-radius: 50%;
            animation: blink 1.5s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .domain-name {
            font-size: 2.5rem;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            word-break: break-word;
            overflow-wrap: break-word;
            hyphens: auto;
            text-shadow: 0 0 40px rgba(0, 240, 255, 0.5);
            animation: textGlow 3s ease-in-out infinite;
        }

        @keyframes textGlow {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.4)); }
            50% { filter: drop-shadow(0 0 40px rgba(255, 0, 110, 0.6)); }
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-dim);
            margin-bottom: 3.5rem;
            line-height: 1.6;
            max-width: 600px;
        }

        .cta-row {
            display: flex;
            gap: 1rem;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 200px;
            padding: 1.3rem 2rem;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 2px solid;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            font-family: 'Space Grotesk', sans-serif;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-neon {
            background: transparent;
            border-color: var(--neon-blue);
            color: var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }

        .btn-neon:hover {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.6);
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            border-color: rgba(255, 255, 255, 0.3);
            color: var(--text);
        }

        .btn-outline:hover {
            border-color: var(--neon-pink);
            color: var(--neon-pink);
            box-shadow: 0 0 20px rgba(255, 0, 110, 0.3);
        }

        .contact-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            flex-wrap: wrap;
            gap: 1rem;
        }

        .contact-label {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .contact-value {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
        }

        /* Tablet */
        @media (max-width: 768px) {
            .card {
                padding: 3rem 2.5rem;
            }

            .header {
                justify-content: center;
                text-align: center;
            }

            .domain-name {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1rem;
                margin-bottom: 3rem;
            }

            .btn {
                min-width: 180px;
            }
        }

        /* Mobile */
        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .card {
                padding: 2.5rem 1.5rem;
                clip-path: polygon(0 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%);
            }

            .card::before {
                clip-path: polygon(0 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%);
            }

            .corner-notch {
                width: 20px;
                height: 20px;
            }

            .header {
                margin-bottom: 2rem;
            }

            .logo {
                font-size: 1rem;
            }

            .status-pill {
                font-size: 0.7rem;
                padding: 0.4rem 0.8rem;
            }

            .domain-name {
                margin-bottom: 0.8rem;
            }

            .subtitle {
                font-size: 0.95rem;
                margin-bottom: 2.5rem;
            }

            .stats {
                grid-template-columns: 1fr;
                gap: 1rem;
                padding: 1.5rem;
                margin-bottom: 2.5rem;
            }

            .stat-value {
                font-size: 1.5rem;
            }

            .stat-label {
                font-size: 0.75rem;
            }

            .cta-row {
                flex-direction: column;
                margin-bottom: 2rem;
            }

            .btn {
                width: 100%;
                min-width: unset;
                padding: 1.1rem 1.5rem;
                font-size: 0.8rem;
            }

            .contact-bar {
                flex-direction: column;
                text-align: center;
                padding-top: 1.5rem;
            }
        }

        /* Extra small */
        @media (max-width: 400px) {
            .card {
                padding: 2rem 1.2rem;
            }

            .logo {
                font-size: 0.9rem;
                letter-spacing: 2px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-layer">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
    </div>

    <div class="container">
        <div class="card">
            <div class="corner-notch"></div>

            <div class="header">
                <div class="logo">Domain For Sale</div>
                <div class="status-pill">
                    <div class="status-dot"></div>
                    <span>Available</span>
                </div>
            </div>

            <div class="domain-name" id="domain-display">www.example.com</div>

            <p class="subtitle">
                Premium domain available for acquisition. A rare digital asset perfect for establishing your brand's online presence.
            </p>

            <div class="cta-row">
                <a href="mailto:masonklaassen0@gmail.com?subject=Domain Inquiry" class="btn btn-neon" id="contact-btn">
                    Make Offer
                </a>
                <a href="tel:+13163125785" class="btn btn-outline">
                    Call Now
                </a>
            </div>

            <div class="contact-bar">
                <div>
                    <div class="contact-label">Direct Line</div>
                    <div class="contact-value">(316) 312-5785</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function adjustDomainSize() {
            const domainEl = document.getElementById('domain-display');
            const domainText = domainEl.innerText;
            const domainLength = domainText.length;
            
            let fontSize;
            
            if (window.innerWidth <= 400) {
                if (domainLength <= 15) fontSize = 1.8;
                else if (domainLength <= 20) fontSize = 1.5;
                else if (domainLength <= 25) fontSize = 1.3;
                else if (domainLength <= 30) fontSize = 1.1;
                else fontSize = 1;
            } else if (window.innerWidth <= 600) {
                if (domainLength <= 15) fontSize = 2.2;
                else if (domainLength <= 20) fontSize = 1.8;
                else if (domainLength <= 25) fontSize = 1.5;
                else if (domainLength <= 30) fontSize = 1.3;
                else fontSize = 1.1;
            } else if (window.innerWidth <= 768) {
                if (domainLength <= 15) fontSize = 2.5;
                else if (domainLength <= 20) fontSize = 2.1;
                else if (domainLength <= 25) fontSize = 1.8;
                else if (domainLength <= 30) fontSize = 1.5;
                else fontSize = 1.3;
            } else {
                if (domainLength <= 15) fontSize = 3.2;
                else if (domainLength <= 20) fontSize = 2.8;
                else if (domainLength <= 25) fontSize = 2.4;
                else if (domainLength <= 30) fontSize = 2.1;
                else if (domainLength <= 40) fontSize = 1.8;
                else fontSize = 1.5;
            }
            
            domainEl.style.fontSize = fontSize + 'rem';
        }
        
        let cleanHost = window.location.hostname;
        
        // Optional: Remove 'www.' prefix
        // Uncomment the next line if you want to remove 'www.':
        // cleanHost = cleanHost.replace(/^www\./, '');
        
        document.getElementById('domain-display').innerText = cleanHost;
        
        const emailBtn = document.getElementById('contact-btn');
        const currentHref = emailBtn.getAttribute('href');
        emailBtn.setAttribute('href', currentHref + ": " + cleanHost);
        
        adjustDomainSize();
        
        window.addEventListener('resize', adjustDomainSize);
    </script>

</body>
</html>
