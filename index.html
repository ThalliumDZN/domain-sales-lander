<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Domain For Sale</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        :root {
            --bg: #0a0a0a;
            --text-primary: #ffffff;
            --text-secondary: #6b7280;
            --accent: #22c55e;
            --accent-dark: #16a34a;
            --border: rgba(255, 255, 255, 0.06);
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Spotlight effect */
        body::before {
            content: '';
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(34, 197, 94, 0.15), transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            animation: spotlightPulse 8s ease-in-out infinite;
        }

        @keyframes spotlightPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.5; }
        }

        .container {
            max-width: 900px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .corner-accent {
            position: absolute;
            width: 80px;
            height: 80px;
            border: 2px solid var(--accent);
            pointer-events: none;
        }

        .corner-accent.top-left {
            top: -10px;
            left: -10px;
            border-right: none;
            border-bottom: none;
        }

        .corner-accent.bottom-right {
            bottom: -10px;
            right: -10px;
            border-left: none;
            border-top: none;
        }

        .content {
            border: 1px solid var(--border);
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(10px);
            padding: 4rem 3rem;
            position: relative;
        }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 3rem;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--accent);
            font-weight: 700;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--accent);
            animation: statusPulse 2s ease-in-out infinite;
        }

        @keyframes statusPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .domain-name {
            font-size: 2.5rem;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
            word-break: break-word;
            overflow-wrap: break-word;
            hyphens: auto;
            letter-spacing: -0.02em;
        }

        .separator {
            width: 60px;
            height: 3px;
            background: var(--accent);
            margin: 2rem 0;
        }

        .description {
            font-size: 1.15rem;
            line-height: 1.8;
            color: var(--text-secondary);
            margin-bottom: 3rem;
            max-width: 600px;
        }

        .cta-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 1.2rem 2.5rem;
            font-size: 0.95rem;
            font-weight: 700;
            text-decoration: none;
            border: 2px solid;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--accent-dark);
            transition: left 0.3s ease;
            z-index: 0;
        }

        .btn-primary:hover::before {
            left: 0;
        }

        .btn-primary span {
            position: relative;
            z-index: 1;
        }

        .btn-primary:hover {
            transform: translateX(5px);
        }

        .btn-secondary {
            background: transparent;
            border-color: var(--border);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            border-color: var(--accent);
            background: rgba(34, 197, 94, 0.05);
        }

        .contact-info {
            padding-top: 2rem;
            border-top: 1px solid var(--border);
        }

        .contact-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-secondary);
            margin-bottom: 0.8rem;
            font-weight: 600;
        }

        .contact-value {
            font-size: 1.1rem;
            color: var(--text-primary);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Scanline effect */
        .content::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            animation: scanline 3s linear infinite;
            opacity: 0.3;
        }

        @keyframes scanline {
            0% { transform: translateY(0); }
            100% { transform: translateY(500px); }
        }

        /* Tablet */
        @media (max-width: 768px) {
            .content {
                padding: 3rem 2rem;
            }

            .corner-accent {
                width: 60px;
                height: 60px;
            }

            .domain-name {
                font-size: 2rem;
            }

            .description {
                font-size: 1.05rem;
            }

            .btn {
                padding: 1.1rem 2rem;
                font-size: 0.9rem;
            }
        }

        /* Mobile */
        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .content {
                padding: 2.5rem 1.5rem;
            }

            .corner-accent {
                width: 50px;
                height: 50px;
            }

            .corner-accent.top-left {
                top: -8px;
                left: -8px;
            }

            .corner-accent.bottom-right {
                bottom: -8px;
                right: -8px;
            }

            .status-bar {
                font-size: 0.7rem;
                margin-bottom: 2rem;
            }

            .domain-name {
                margin-bottom: 1.2rem;
            }

            .separator {
                width: 50px;
                margin: 1.5rem 0;
            }

            .description {
                font-size: 0.95rem;
                margin-bottom: 2rem;
            }

            .cta-group {
                flex-direction: column;
                margin-bottom: 2rem;
            }

            .btn {
                width: 100%;
                justify-content: center;
                padding: 1rem 1.5rem;
            }

            .contact-info {
                padding-top: 1.5rem;
            }

            .contact-value {
                font-size: 1rem;
            }
        }

        /* Extra small */
        @media (max-width: 400px) {
            .content {
                padding: 2rem 1.2rem;
            }

            .status-bar {
                font-size: 0.65rem;
                letter-spacing: 2px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="corner-accent top-left"></div>
        <div class="corner-accent bottom-right"></div>
        
        <div class="content">
            <div class="status-bar">
                <div class="status-indicator"></div>
                <span>Available for Acquisition</span>
            </div>

            <div class="domain-name" id="domain-display">www.example.com</div>

            <div class="separator"></div>

            <p class="description">
                A rare opportunity to own a premium digital address. Position your brand at the forefront with this exclusive domain asset.
            </p>

            <div class="cta-group">
                <a href="mailto:masonklaassen0@gmail.com?subject=Domain Inquiry" class="btn btn-primary" id="contact-btn">
                    <span>→</span>
                    <span>Make an Offer</span>
                </a>
                <a href="tel:+13163125785" class="btn btn-secondary">
                    <span>📞</span>
                    <span>Call Direct</span>
                </a>
            </div>

            <div class="contact-info">
                <div class="contact-label">Direct Line</div>
                <div class="contact-value">(316) 312-5785</div>
            </div>
        </div>
    </div>

    <script>
        function adjustDomainSize() {
            const domainEl = document.getElementById('domain-display');
            const domainText = domainEl.innerText;
            const domainLength = domainText.length;
            
            let fontSize;
            
            if (window.innerWidth <= 400) {
                if (domainLength <= 15) fontSize = 1.8;
                else if (domainLength <= 20) fontSize = 1.5;
                else if (domainLength <= 25) fontSize = 1.3;
                else if (domainLength <= 30) fontSize = 1.1;
                else fontSize = 1;
            } else if (window.innerWidth <= 600) {
                if (domainLength <= 15) fontSize = 2.2;
                else if (domainLength <= 20) fontSize = 1.8;
                else if (domainLength <= 25) fontSize = 1.5;
                else if (domainLength <= 30) fontSize = 1.3;
                else fontSize = 1.1;
            } else if (window.innerWidth <= 768) {
                if (domainLength <= 15) fontSize = 2.5;
                else if (domainLength <= 20) fontSize = 2.1;
                else if (domainLength <= 25) fontSize = 1.8;
                else if (domainLength <= 30) fontSize = 1.5;
                else fontSize = 1.3;
            } else {
                if (domainLength <= 15) fontSize = 3.5;
                else if (domainLength <= 20) fontSize = 3;
                else if (domainLength <= 25) fontSize = 2.5;
                else if (domainLength <= 30) fontSize = 2.2;
                else if (domainLength <= 40) fontSize = 1.8;
                else fontSize = 1.5;
            }
            
            domainEl.style.fontSize = fontSize + 'rem';
        }
        
        let cleanHost = window.location.hostname;
        
        // Optional: Remove 'www.' prefix
        // Uncomment the next line if you want to remove 'www.':
        // cleanHost = cleanHost.replace(/^www\./, '');
        
        document.getElementById('domain-display').innerText = cleanHost;
        
        const emailBtn = document.getElementById('contact-btn');
        const currentHref = emailBtn.getAttribute('href');
        emailBtn.setAttribute('href', currentHref + ": " + cleanHost);
        
        adjustDomainSize();
        
        window.addEventListener('resize', adjustDomainSize);
    </script>

</body>
</html>
