<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Domain For Sale</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-mid: #111111;
            --card-bg: rgba(18, 18, 18, 0.85);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-sub: #a1a1aa;
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.4);
            --btn-hover: #059669;
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(ellipse at 20% 20%, rgba(16, 185, 129, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 50%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            animation: fadeIn 1s ease-out forwards;
            opacity: 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container {
            text-align: center;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 2.5rem 2rem;
            border-radius: 24px;
            border: 1px solid var(--card-border);
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            max-width: 680px;
            width: 100%;
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
            position: relative;
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(16, 185, 129, 0.5), transparent);
        }
        
        .container:hover {
            transform: translateY(-5px);
            box-shadow: 
                0 25px 70px rgba(0, 0, 0, 0.6),
                0 0 60px rgba(16, 185, 129, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        h1 {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 1.5rem;
            opacity: 1;
            text-shadow: 0 0 20px var(--accent-glow);
        }

        .domain-name {
            font-weight: 800;
            margin: 0 0 1.5rem 0;
            line-height: 1.2;
            word-break: break-word;
            background: linear-gradient(135deg, #ffffff 0%, #10b981 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 2.5rem;
            overflow-wrap: break-word;
            hyphens: auto;
            filter: drop-shadow(0 0 30px rgba(16, 185, 129, 0.3));
        }

        p {
            color: var(--text-sub);
            font-size: 1.05rem;
            line-height: 1.7;
            margin-bottom: 2rem;
            max-width: 90%;
            margin-left: auto;
            margin-right: auto;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(135deg, var(--accent) 0%, #059669 100%);
            color: #ffffff;
            padding: 1.1rem 2.5rem;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.05rem;
            border-radius: 12px;
            transition: all 0.3s ease;
            width: 100%;
            max-width: 340px;
            box-shadow: 
                0 4px 20px var(--accent-glow),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .btn:hover {
            background: linear-gradient(135deg, #059669 0%, var(--accent) 100%);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 
                0 6px 30px rgba(16, 185, 129, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .phone-number {
            margin-top: 2rem;
            font-size: 1rem;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 600;
        }
        
        .phone-icon {
            color: var(--text-main); 
            font-size: 1.2em;
        }

        /* Tablet adjustments */
        @media (max-width: 768px) {
            .container {
                padding: 2rem 1.5rem;
            }
            
            h1 {
                font-size: 0.8rem;
                letter-spacing: 2.5px;
            }
            
            p {
                font-size: 1rem;
                margin-bottom: 1.8rem;
            }
            
            .btn {
                padding: 1rem 2rem;
                font-size: 1rem;
            }
        }

        /* Mobile adjustments */
        @media (max-width: 600px) {
            body {
                padding: 15px;
            }
            
            .container {
                padding: 2rem 1.2rem;
                border-radius: 20px;
            }
            
            h1 {
                font-size: 0.75rem;
                letter-spacing: 2px;
                margin-bottom: 1.2rem;
            }
            
            .domain-name {
                margin-bottom: 1.2rem;
            }
            
            p {
                font-size: 0.95rem;
                max-width: 100%;
                margin-bottom: 1.5rem;
            }
            
            .btn {
                padding: 1rem 1.5rem;
                font-size: 0.95rem;
                max-width: 100%;
            }
            
            .phone-number {
                margin-top: 1.5rem;
                font-size: 0.9rem;
                flex-wrap: wrap;
            }
        }

        /* Extra small devices */
        @media (max-width: 400px) {
            .container {
                padding: 1.5rem 1rem;
            }
            
            h1 {
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Premium Domain Available For Purchase</h1>
        <div class="domain-name" id="domain-display">www.example.com</div>
        <p>This premium domain is currently available. Secure this domain for your brand today.</p>
        
        <a href="mailto:masonklaassen0@gmail.com?subject=Domain Inquiry" class="btn" id="contact-btn">
            Inquire via Email
        </a>

        <div class="phone-number">
            <span class="phone-icon">📞</span> (316) 312-5785
        </div>
    </div>

    <script>
        function adjustDomainSize() {
            const domainEl = document.getElementById('domain-display');
            const containerWidth = domainEl.parentElement.offsetWidth;
            const domainText = domainEl.innerText;
            const domainLength = domainText.length;
            
            // Calculate ideal font size based on domain length and container width
            let fontSize;
            
            // Base calculations on character count and available width
            if (window.innerWidth <= 400) {
                // Extra small mobile
                if (domainLength <= 15) fontSize = 1.8;
                else if (domainLength <= 20) fontSize = 1.5;
                else if (domainLength <= 25) fontSize = 1.3;
                else if (domainLength <= 30) fontSize = 1.1;
                else fontSize = 1;
            } else if (window.innerWidth <= 600) {
                // Mobile
                if (domainLength <= 15) fontSize = 2.2;
                else if (domainLength <= 20) fontSize = 1.8;
                else if (domainLength <= 25) fontSize = 1.5;
                else if (domainLength <= 30) fontSize = 1.3;
                else fontSize = 1.1;
            } else if (window.innerWidth <= 768) {
                // Tablet
                if (domainLength <= 15) fontSize = 2.8;
                else if (domainLength <= 20) fontSize = 2.3;
                else if (domainLength <= 25) fontSize = 2;
                else if (domainLength <= 30) fontSize = 1.7;
                else fontSize = 1.5;
            } else {
                // Desktop
                if (domainLength <= 15) fontSize = 3.5;
                else if (domainLength <= 20) fontSize = 3;
                else if (domainLength <= 25) fontSize = 2.5;
                else if (domainLength <= 30) fontSize = 2.2;
                else if (domainLength <= 40) fontSize = 1.8;
                else fontSize = 1.5;
            }
            
            domainEl.style.fontSize = fontSize + 'rem';
        }
        
        // Get the hostname
        let cleanHost = window.location.hostname;
        
        // Optional: Remove 'www.' prefix
        // Uncomment the next line if you want to remove 'www.':
        // cleanHost = cleanHost.replace(/^www\./, '');
        
        // Set the domain name
        document.getElementById('domain-display').innerText = cleanHost;
        
        // Update email link
        const emailBtn = document.getElementById('contact-btn');
        const currentHref = emailBtn.getAttribute('href');
        emailBtn.setAttribute('href', currentHref + ": " + cleanHost);
        
        // Adjust size after setting text
        adjustDomainSize();
        
        // Adjust on window resize
        window.addEventListener('resize', adjustDomainSize);
    </script>

</body>
</html>
