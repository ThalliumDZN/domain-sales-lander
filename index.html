<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Domain For Sale</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        :root {
            --bg: #000000;
            --card: #0f0f0f;
            --text: #ffffff;
            --text-dim: #737373;
            --gold: #d4af37;
            --gold-light: #f4d47e;
            --border: rgba(212, 175, 55, 0.2);
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* Subtle noise texture */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 999;
        }

        /* Radial glow */
        body::after {
            content: '';
            position: fixed;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.08), transparent 60%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            animation: glowPulse 6s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.1); }
        }

        .wrapper {
            max-width: 700px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        /* Ornamental corners */
        .card::before,
        .card::after {
            content: '';
            position: absolute;
            width: 100px;
            height: 100px;
            border: 1px solid var(--gold);
            opacity: 0.3;
        }

        .card::before {
            top: 20px;
            left: 20px;
            border-right: none;
            border-bottom: none;
        }

        .card::after {
            bottom: 20px;
            right: 20px;
            border-left: none;
            border-top: none;
        }

        .inner {
            padding: 5rem 4rem;
            position: relative;
            text-align: center;
        }

        .monogram {
            width: 60px;
            height: 60px;
            margin: 0 auto 2.5rem;
            border: 2px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 300;
            color: var(--gold);
            letter-spacing: 2px;
            position: relative;
        }

        .monogram::before,
        .monogram::after {
            content: '';
            position: absolute;
            width: 2px;
            height: 8px;
            background: var(--gold);
        }

        .monogram::before {
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
        }

        .monogram::after {
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
        }

        .label {
            font-size: 0.75rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold);
            font-weight: 500;
            margin-bottom: 2rem;
        }

        .domain-name {
            font-size: 2.5rem;
            font-weight: 300;
            line-height: 1.2;
            margin-bottom: 1.5rem;
            color: var(--text);
            word-break: break-word;
            overflow-wrap: break-word;
            hyphens: auto;
            letter-spacing: -0.01em;
        }

        .ornament {
            width: 120px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 2rem auto;
            position: relative;
        }

        .ornament::before {
            content: '◆';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--gold);
            font-size: 0.6rem;
            background: var(--card);
            padding: 0 10px;
        }

        .tagline {
            font-size: 1rem;
            line-height: 1.8;
            color: var(--text-dim);
            margin-bottom: 3rem;
            font-weight: 300;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
            margin-bottom: 3rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 1.2rem 3rem;
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
            border: 1px solid;
            transition: all 0.4s ease;
            letter-spacing: 2px;
            text-transform: uppercase;
            min-width: 280px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: var(--gold);
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease;
        }

        .btn span {
            position: relative;
            z-index: 1;
            transition: color 0.4s ease;
        }

        .btn-primary {
            background: var(--gold);
            border-color: var(--gold);
            color: #000;
        }

        .btn-primary:hover::before {
            width: 400px;
            height: 400px;
            background: var(--gold-light);
        }

        .btn-secondary {
            background: transparent;
            border-color: var(--border);
            color: var(--gold);
        }

        .btn-secondary:hover {
            border-color: var(--gold);
            background: rgba(212, 175, 55, 0.05);
        }

        .footer {
            padding-top: 2.5rem;
            border-top: 1px solid var(--border);
            font-size: 0.85rem;
            color: var(--text-dim);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .footer-label {
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--gold);
            opacity: 0.7;
        }

        .phone {
            font-size: 1rem;
            color: var(--text);
            font-weight: 400;
            letter-spacing: 1px;
        }

        /* Shine effect */
        @keyframes shine {
            0% { left: -100%; }
            100% { left: 200%; }
        }

        .card-shine {
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.1), transparent);
            animation: shine 8s infinite;
            pointer-events: none;
        }

        /* Tablet */
        @media (max-width: 768px) {
            .inner {
                padding: 4rem 3rem;
            }

            .monogram {
                width: 50px;
                height: 50px;
                font-size: 1.3rem;
                margin-bottom: 2rem;
            }

            .label {
                font-size: 0.7rem;
                letter-spacing: 3px;
            }

            .domain-name {
                font-size: 2rem;
            }

            .tagline {
                font-size: 0.95rem;
            }

            .btn {
                padding: 1.1rem 2.5rem;
                font-size: 0.8rem;
                min-width: 260px;
            }
        }

        /* Mobile */
        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .card::before,
            .card::after {
                width: 60px;
                height: 60px;
            }

            .card::before {
                top: 15px;
                left: 15px;
            }

            .card::after {
                bottom: 15px;
                right: 15px;
            }

            .inner {
                padding: 3rem 2rem;
            }

            .monogram {
                width: 45px;
                height: 45px;
                font-size: 1.1rem;
                margin-bottom: 1.5rem;
            }

            .label {
                font-size: 0.65rem;
                letter-spacing: 2px;
                margin-bottom: 1.5rem;
            }

            .domain-name {
                margin-bottom: 1.2rem;
            }

            .ornament {
                width: 100px;
                margin: 1.5rem auto;
            }

            .tagline {
                font-size: 0.9rem;
                margin-bottom: 2.5rem;
            }

            .actions {
                gap: 0.8rem;
                margin-bottom: 2.5rem;
            }

            .btn {
                width: 100%;
                min-width: unset;
                padding: 1.1rem 2rem;
                font-size: 0.75rem;
                letter-spacing: 1.5px;
            }

            .footer {
                padding-top: 2rem;
            }

            .phone {
                font-size: 0.95rem;
            }
        }

        /* Extra small */
        @media (max-width: 400px) {
            .inner {
                padding: 2.5rem 1.5rem;
            }

            .card::before,
            .card::after {
                width: 50px;
                height: 50px;
            }

            .label {
                font-size: 0.6rem;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="card">
            <div class="card-shine"></div>
            
            <div class="inner">
                <div class="monogram">◇</div>
                
                <div class="label">Exclusive Offering</div>
                
                <div class="domain-name" id="domain-display">www.example.com</div>
                
                <div class="ornament"></div>
                
                <p class="tagline">
                    A distinguished digital property of exceptional value and prestige, available to discerning buyers.
                </p>
                
                <div class="actions">
                    <a href="mailto:your-email@example.com?subject=Domain Inquiry" class="btn btn-primary" id="contact-btn">
                        <span>Inquire Now</span>
                    </a>
                    <a href="tel:+15551234567" class="btn btn-secondary">
                        <span>Schedule Call</span>
                    </a>
                </div>
                
                <div class="footer">
                    <div class="footer-label">Private Line</div>
                    <div class="phone">(555) 123-4567</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function adjustDomainSize() {
            const domainEl = document.getElementById('domain-display');
            const domainText = domainEl.innerText;
            const domainLength = domainText.length;
            
            let fontSize;
            
            if (window.innerWidth <= 400) {
                if (domainLength <= 15) fontSize = 1.8;
                else if (domainLength <= 20) fontSize = 1.5;
                else if (domainLength <= 25) fontSize = 1.3;
                else if (domainLength <= 30) fontSize = 1.1;
                else fontSize = 1;
            } else if (window.innerWidth <= 600) {
                if (domainLength <= 15) fontSize = 2.2;
                else if (domainLength <= 20) fontSize = 1.8;
                else if (domainLength <= 25) fontSize = 1.5;
                else if (domainLength <= 30) fontSize = 1.3;
                else fontSize = 1.1;
            } else if (window.innerWidth <= 768) {
                if (domainLength <= 15) fontSize = 2.5;
                else if (domainLength <= 20) fontSize = 2.1;
                else if (domainLength <= 25) fontSize = 1.8;
                else if (domainLength <= 30) fontSize = 1.5;
                else fontSize = 1.3;
            } else {
                if (domainLength <= 15) fontSize = 3.2;
                else if (domainLength <= 20) fontSize = 2.8;
                else if (domainLength <= 25) fontSize = 2.4;
                else if (domainLength <= 30) fontSize = 2.1;
                else if (domainLength <= 40) fontSize = 1.8;
                else fontSize = 1.5;
            }
            
            domainEl.style.fontSize = fontSize + 'rem';
        }
        
        let cleanHost = window.location.hostname;
        
        // Optional: Remove 'www.' prefix
        // Uncomment the next line if you want to remove 'www.':
        // cleanHost = cleanHost.replace(/^www\./, '');
        
        document.getElementById('domain-display').innerText = cleanHost;
        
        const emailBtn = document.getElementById('contact-btn');
        const currentHref = emailBtn.getAttribute('href');
        emailBtn.setAttribute('href', currentHref + ": " + cleanHost);
        
        adjustDomainSize();
        
        window.addEventListener('resize', adjustDomainSize);
    </script>

</body>
</html>
